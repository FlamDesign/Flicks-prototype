# Flicks AI server. Deployed by .github/workflows/ai-server.yml; keys are Worker secrets, never here.
name = "flicks-ai"
main = "worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# browsers on other sites are refused; the passcode is still required from everywhere
ALLOWED_ORIGINS = "https://flam-flicks.pages.dev,https://*.flam-flicks.pages.dev,https://flamdesign.github.io,http://localhost:5173,http://localhost:4173"
DAILY_IMAGE_CAP = "200"
DAILY_CHAT_CAP = "500"
# videos cost the most (about $0.46 a second at 720p): keep this low
DAILY_VIDEO_CAP = "70"
# videos: Higgsfield, 720p only
HF_VIDEO_PATH = "/bytedance/seedance-2.5/text-to-video"
HF_VIDEO_IMAGE_PATH = "/bytedance/seedance-2.5/image-to-video"
# videos that stay true to images, or follow a video (variations that change a lot)
HF_VIDEO_REF_PATH = "/bytedance/seedance-2.5/reference-to-video"
# variations: edits of the approved reference video
HF_VIDEO_EDIT_PATH = "/bytedance/seedance-2.5/video-edit"
# suggested looks, product and character sheets, and edits of the user's photos: Marketing Studio Flare
HF_IMAGE_FLARE_PATH = "/marketing-studio/image/flare"
# backup for images from a prompt alone
HF_IMAGE_PATH = "/higgsfield-ai/soul/v2/standard"
# backups for images that keep the user's product (after Flare): Qwen edit, then the older Marketing Studio
HF_IMAGE_EDIT_PATH = "/alibaba/qwen-image-3/edit"
HF_IMAGE_REF_PATH = "/marketing-studio/image"
# images with readable text (badges, offers)
HF_IMAGE_TEXT_PATH = "/ideogram/v4.0"

# logs in the Cloudflare dashboard (Workers > flicks-ai > Logs), for debugging failures
[observability]
enabled = true

[[kv_namespaces]]
binding = "USAGE"
id = "__USAGE_KV_ID__"
